services:
  jenkins:
    build: .
    container_name: jenkins-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      # Data persistency
      - jenkins_data:/var/jenkins_home
      # (Optional) If you need Jenkins to run Docker containers (Docker In Docker / Docker Agents)
      # Uncomment the following line and ensure you have correct permissions:
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_data:
